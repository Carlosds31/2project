name: Verification automatique du code

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      erreurs: ${{ steps.compteur.outputs.erreurs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g html-validate stylelint eslint

      - name: Valider
        run: |
          echo "=== HTML ===" > rapport.txt
          if find . -name "*.html" | grep -q .; then
            npx html-validate "**/*.html" --max-warnings=0 >> rapport.txt 2>&1 || true
          else echo "Aucun" >> rapport.txt; fi
          echo "=== CSS ===" >> rapport.txt
          if find . -name "*.css" | grep -q .; then
            [ -f .stylelintrc.json ] || echo '{"rules":{}}' > .stylelintrc.json
            npx stylelint "**/*.css" >> rapport.txt 2>&1 || true
          else echo "Aucun" >> rapport.txt; fi
          echo "=== JS ===" >> rapport.txt
          if find . -name "*.js" | grep -q .; then
            [ -f .eslintrc.json ] || echo '{"env":{"browser":true,"es2021":true},"parserOptions":{"ecmaVersion":"latest"},"rules":{}}' > .eslintrc.json
            npx eslint "**/*.js" >> rapport.txt 2>&1 || true
          else echo "Aucun" >> rapport.txt; fi

      - name: Compter les erreurs
        id: compteur
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || true); ERREURS=${ERREURS:-0}
          echo "erreurs=$ERREURS" >> $GITHUB_OUTPUT

      - name: Statut horaire
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || echo 0)
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Statut")) | .number' | head -1)
          [ -z "$ID" ] && { gh issue create --title "Statut verification" --body "Statut" > /dev/null; ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Statut")) | .number' | head -1); }
          if [ "$ERREURS" = "0" ]; then
            echo "OK - Aucune erreur le $(date -u '+%d/%m/%Y %H:%M UTC')" | gh issue comment "$ID" --body-file -
          else
            echo "ATTENTION : $ERREURS erreur(s) - $(date -u '+%d/%m/%Y %H:%M UTC') - approbation requise" | gh issue comment "$ID" --body-file -
          fi

      - name: Creer alerte
        if: steps.compteur.outputs.erreurs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Erreurs detectees" > alerte.txt
          echo "" >> alerte.txt
          cat rapport.txt >> alerte.txt
          echo "" >> alerte.txt
          echo "---" >> alerte.txt
          echo "**Approuve la verification pour corriger automatiquement ces erreurs.**" >> alerte.txt
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problemes")) | .number' | head -1)
          if [ -z "$ID" ]; then
            gh issue create --title "Problemes detectes" --body-file alerte.txt
          else
            gh issue comment "$ID" --body-file alerte.txt
          fi

  corriger:
    needs: check
    if: needs.check.outputs.erreurs != '0'
    runs-on: ubuntu-latest
    environment: corrections
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g html-validate stylelint eslint

      - name: Re-valider pour obtenir les erreurs a jour
        run: |
          echo "=== HTML ===" > rapport.txt
          if find . -name "*.html" | grep -q .; then
            npx html-validate "**/*.html" --max-warnings=0 >> rapport.txt 2>&1 || true
          fi
          echo "=== CSS ===" >> rapport.txt
          if find . -name "*.css" | grep -q .; then
            [ -f .stylelintrc.json ] || echo '{"rules":{}}' > .stylelintrc.json
            npx stylelint "**/*.css" >> rapport.txt 2>&1 || true
          fi
          echo "=== JS ===" >> rapport.txt
          if find . -name "*.js" | grep -q .; then
            [ -f .eslintrc.json ] || echo '{"env":{"browser":true,"es2021":true},"parserOptions":{"ecmaVersion":"latest"},"rules":{}}' > .eslintrc.json
            npx eslint "**/*.js" >> rapport.txt 2>&1 || true
          fi

      - name: Corriger automatiquement
        run: |
          python3 .github/auto-fix.py rapport.txt > resultat.txt 2>&1 || true
          cat resultat.txt

      - name: Generer le rapport avant/apres
        run: |
          echo "## CORRECTION APPLIQUEE" > rapport-final.md
          echo "" >> rapport-final.md
          echo "Approuve et corrige le $(date -u '+%d/%m/%Y %H:%M UTC')" >> rapport-final.md
          echo "" >> rapport-final.md
          cat resultat.txt >> rapport-final.md

      - name: Pousser les corrections
        run: |
          git config user.email "carlosds31@users.noreply.github.com"
          git config user.name "Carlosds31 (auto-fix)"
          git add -u
          git diff --cached --quiet || git commit -m "Correction automatique des erreurs (approuvee)"
          git status --short
          git push origin HEAD

      - name: Publier le rapport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problemes")) | .number' | head -1)
          [ -n "$ID" ] && gh issue comment "$ID" --body-file rapport-final.md
