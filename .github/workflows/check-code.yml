name: Vérification automatique du code

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils de vérification
        run: npm install -g html-validate stylelint eslint

      - name: Vérifier le HTML
        run: |
          if find . -name "*.html" -not -path "./.git/*" | grep -q .; then
            echo "=== RAPPORT HTML ===" >> rapport.txt
            npx html-validate "**/*.html" --max-warnings=0 >> rapport.txt 2>&1 || true
          else
            echo "ℹ️ Aucun fichier HTML" >> rapport.txt
          fi

      - name: Vérifier le CSS
        run: |
          if find . -name "*.css" -not -path "./.git/*" | grep -q .; then
            echo "=== RAPPORT CSS ===" >> rapport.txt
            npx stylelint "**/*.css" >> rapport.txt 2>&1 || true
          else
            echo "ℹ️ Aucun fichier CSS" >> rapport.txt
          fi

      - name: Vérifier le JavaScript
        run: |
          if find . -name "*.js" -not -path "./.git/*" | grep -q .; then
            echo "=== RAPPORT JAVASCRIPT ===" >> rapport.txt
            npx eslint "**/*.js" >> rapport.txt 2>&1 || true
          else
            echo "ℹ️ Aucun fichier JS" >> rapport.txt
          fi

      - name: Créer le rapport d'alerte (Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt || echo 0)
          if [ "$ERREURS" != "0" ]; then
            echo "=== RAPPORT DE VERIFICATION ===" > body.txt
            echo "" >> body.txt
            echo "**$ERREURS erreur(s) détectée(s)** dans ${{ github.repository }} le $(date -u '+%d/%m/%Y a %H:%M UTC')" >> body.txt
            echo "" >> body.txt
            echo "Declenche par : ${{ github.event_name }}" >> body.txt
            echo "" >> body.txt
            cat rapport.txt >> body.txt
            echo "" >> body.txt
            echo "---" >> body.txt
            echo "Pour corriger : dis-moi 'oui, corrige' et je m'occupe des corrections !" >> body.txt

            EXISTANTE=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problèmes détectés")) | .number' | head -1)
            if [ -z "$EXISTANTE" ]; then
              gh issue create --title "🚨 Problèmes détectés dans le code" --body-file body.txt
              echo "✅ Issue créée avec le rapport"
            else
              gh issue comment "$EXISTANTE" --body-file body.txt
              echo "✅ Rapport ajouté à l'issue #$EXISTANTE"
            fi
          else
            echo "✅ Aucune erreur détectée - pas de rapport nécessaire"
          fi

      - name: Échec si erreurs (déclenche la notification email)
        if: always()
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt || echo 0)
          if [ "$ERREURS" != "0" ]; then
            echo "❌ $ERREURS erreur(s) détectée(s) - rapport créé, correction en attente"
            exit 1
          fi
          echo "✅ Vérification terminée : aucune erreur"
