name: Vérification automatique du code

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 */5 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils de vérification
        run: npm install -g html-validate stylelint eslint

      - name: Vérifier le HTML
        run: |
          if find . -name "*.html" -not -path "./.git/*" | grep -q .; then
            echo "=== VÉRIFICATION HTML ==="
            npx html-validate "**/*.html" --max-warnings=0
            echo "=== SUCCÈS : Aucune erreur HTML trouvée ==="
          else
            echo "ℹ️ Aucun fichier HTML trouvé, étape ignorée"
          fi

      - name: Vérifier les fichiers CSS
        run: |
          if find . -name "*.css" -not -path "./.git/*" | grep -q .; then
            echo "=== VÉRIFICATION CSS ==="
            npx stylelint "**/*.css" || echo "⚠️ Problèmes CSS détectés (voir détails)"
          else
            echo "ℹ️ Aucun fichier CSS trouvé, étape ignorée"
          fi

      - name: Vérifier les fichiers JavaScript
        run: |
          if find . -name "*.js" -not -path "./.git/*" | grep -q .; then
            echo "=== VÉRIFICATION JAVASCRIPT ==="
            npx eslint "**/*.js" || echo "⚠️ Problèmes JS détectés (voir détails)"
          else
            echo "ℹ️ Aucun fichier JS trouvé, étape ignorée"
          fi
