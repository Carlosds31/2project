name: Verification automatique du code

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      erreurs: ${{ steps.compteur.outputs.erreurs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g html-validate stylelint eslint

      - name: Valider
        run: |
          echo "=== HTML ===" > rapport.txt
          if find . -name "*.html" | grep -q .; then
            npx html-validate "**/*.html" --max-warnings=0 >> rapport.txt 2>&1 || true
          else echo "Aucun" >> rapport.txt; fi
          echo "=== CSS ===" >> rapport.txt
          if find . -name "*.css" | grep -q .; then
            [ -f .stylelintrc.json ] || echo '{"rules":{}}' > .stylelintrc.json
            npx stylelint "**/*.css" >> rapport.txt 2>&1 || true
          else echo "Aucun" >> rapport.txt; fi
          echo "=== JS ===" >> rapport.txt
          if find . -name "*.js" | grep -q .; then
            [ -f .eslintrc.json ] || echo '{"env":{"browser":true,"es2021":true},"parserOptions":{"ecmaVersion":"latest"},"rules":{}}' > .eslintrc.json
            npx eslint "**/*.js" >> rapport.txt 2>&1 || true
          else echo "Aucun" >> rapport.txt; fi

      - name: Analyser et generer le detail avec code
        id: compteur
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || true); ERREURS=${ERREURS:-0}
          echo "erreurs=$ERREURS" >> $GITHUB_OUTPUT
          if [ "$ERREURS" != "0" ]; then
            echo "## DETAIL DES ERREURS" > detail.md
            echo "" >> detail.md
            echo "### Code concerne :" >> detail.md
            echo "" >> detail.md
            FICHIER=""
            while IFS= read -r L; do
              if echo "$L" | grep -qE '^[/.]'; then FICHIER="$L"
              elif echo "$L" | grep -qE '^\s+[0-9]+:[0-9]+\s+error'; then
                NUM=$(echo "$L" | awk '{print $1}' | cut -d: -f1)
                MSG=$(echo "$L" | sed 's/.*error  *//' | sed 's/  */ /g')
                SHORT=$(basename "$FICHIER" 2>/dev/null)
                CODE=$(sed -n "${NUM}p" "$FICHIER" 2>/dev/null | sed 's/</\&lt;/g; s/>/\&gt;/g')
                echo "" >> detail.md
                echo "**Fichier** : \`$SHORT\` | **Ligne** : $NUM" >> detail.md
                echo "" >> detail.md
                echo '```html' >> detail.md
                echo "$CODE" >> detail.md
                echo '```' >> detail.md
                echo "_Erreur_ : $MSG" >> detail.md
                echo "" >> detail.md
              fi
            done < rapport.txt
          fi

      - name: Statut horaire
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || echo 0)
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Statut")) | .number' | head -1)
          [ -z "$ID" ] && { gh issue create --title "Statut verification" --body "Statut" > /dev/null; ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Statut")) | .number' | head -1); }
          if [ "$ERREURS" = "0" ]; then
            echo "OK - $(date -u '+%d/%m/%Y %H:%M UTC')" | gh issue comment "$ID" --body-file -
          else
            echo "Erreurs: $ERREURS - $(date)" | gh issue comment "$ID" --body-file -
          fi

      - name: Creer alerte
        if: steps.compteur.outputs.erreurs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat detail.md > alerte.txt
          echo "---" >> alerte.txt
          echo "Approbation requise dans l'onglet Actions." >> alerte.txt
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problemes")) | .number' | head -1)
          if [ -z "$ID" ]; then
            gh issue create --title "Problemes detectes" --body-file alerte.txt
          else
            gh issue comment "$ID" --body-file alerte.txt
          fi

  rapport:
    needs: check
    if: needs.check.outputs.erreurs != '0'
    runs-on: ubuntu-latest
    environment: corrections
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g html-validate stylelint eslint

      - name: Verif detaillee + code
        run: |
          echo "## VERIFICATION APPROUVEE" > final.md
          echo "Approuve le $(date -u '+%d/%m/%Y %H:%M UTC')" >> final.md
          echo "" >> final.md
          FICHIER=""
          npx html-validate "**/*.html" --max-warnings=0 > rapport2.txt 2>&1 || true
          while IFS= read -r L; do
            if echo "$L" | grep -qE '^[/.]'; then FICHIER="$L"
            elif echo "$L" | grep -qE '^\s+[0-9]+:[0-9]+\s+error'; then
              NUM=$(echo "$L" | awk '{print $1}' | cut -d: -f1)
              MSG=$(echo "$L" | sed 's/.*error  *//')
              SHORT=$(basename "$FICHIER" 2>/dev/null)
              CODE=$(sed -n "${NUM}p" "$FICHIER" 2>/dev/null | sed 's/</\&lt;/g; s/>/\&gt;/g')
              echo "### \`$SHORT\` ligne $NUM" >> final.md
              echo "_$MSG_" >> final.md
              echo '```' >> final.md
              echo "$CODE" >> final.md
              echo '```' >> final.md
              echo "" >> final.md
              echo "**Correction proposee :**" >> final.md
              if echo "$MSG" | grep -q "no-inline-style"; then
                echo "Deplacer le style vers le fichier CSS." >> final.md
              elif echo "$MSG" | grep -q "wcag/h37"; then
                echo "Ajouter un attribut \`alt\` descriptif." >> final.md
              else
                echo "A corriger selon la regle: $MSG" >> final.md
              fi
              echo "" >> final.md
            fi
          done < rapport2.txt

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problemes")) | .number' | head -1)
          [ -n "$ID" ] && gh issue comment "$ID" --body-file final.md
