name: Verification automatique du code

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      erreurs: ${{ steps.compteur.outputs.erreurs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g html-validate stylelint eslint

      - name: Verifier le HTML
        run: |
          if find . -name "*.html" -not -path "./.git/*" | grep -q .; then
            echo "=== HTML ===" >> rapport.txt
            npx html-validate "**/*.html" --max-warnings=0 >> rapport.txt 2>&1 || true
          else
            echo "Aucun HTML" >> rapport.txt
          fi

      - name: Verifier le CSS
        run: |
          if find . -name "*.css" -not -path "./.git/*" | grep -q .; then
            if ! ls .stylelintrc* stylelint.config.* 2>/dev/null | grep -q .; then
              echo '{"rules":{}}' > .stylelintrc.json
            fi
            echo "=== CSS ===" >> rapport.txt
            npx stylelint "**/*.css" >> rapport.txt 2>&1 || true
          else
            echo "Aucun CSS" >> rapport.txt
          fi

      - name: Verifier le JS
        run: |
          if find . -name "*.js" -not -path "./.git/*" | grep -q .; then
            if ! ls .eslintrc* eslint.config.* 2>/dev/null | grep -q .; then
              echo '{"env":{"browser":true,"es2021":true},"parserOptions":{"ecmaVersion":"latest"},"rules":{}}' > .eslintrc.json
            fi
            echo "=== JS ===" >> rapport.txt
            npx eslint "**/*.js" >> rapport.txt 2>&1 || true
          else
            echo "Aucun JS" >> rapport.txt
          fi

      - name: Compter les erreurs
        id: compteur
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || true); ERREURS=${ERREURS:-0}
          echo "erreurs=$ERREURS" >> $GITHUB_OUTPUT

      - name: Publier le statut horaire (email de confirmation)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || true); ERREURS=${ERREURS:-0}
          DATE=$(date -u '+%d/%m/%Y a %H:%M UTC')
          TRIGGER="${{ github.event_name }}"

          # Trouver ou creer l issue de statut
          STATUT_ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Statut verification")) | .number' | head -1)
          if [ -z "$STATUT_ID" ]; then
            gh issue create --title "Statut verification" --body "Cette issue recoit un commentaire a chaque verification (toutes les 1h) pour confirmer le bon fonctionnement."
            STATUT_ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Statut verification")) | .number' | head -1)
          fi

          # Preparer le commentaire
          echo "Verification du ${DATE}" > msg.txt
          echo "" >> msg.txt
          if [ "$ERREURS" = "0" ]; then
            echo "OK - Aucune erreur detectee." >> msg.txt
          else
            echo "ATTENTION : ${ERREURS} erreur(s) trouvee(s)" >> msg.txt
          fi
          echo "" >> msg.txt
          echo "Declenche par : ${TRIGGER}" >> msg.txt

          gh issue comment "$STATUT_ID" --body-file msg.txt
          echo "Statut publie sur l'issue #$STATUT_ID"

      - name: Creer le rapport d alerte
        if: steps.compteur.outputs.erreurs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERREURS=$(grep -ciE " error " rapport.txt 2>/dev/null || true); ERREURS=${ERREURS:-0}
          echo "### Rapport de verification" > body.txt
          echo "**${ERREURS} erreur(s)** dans ${{ github.repository }}" >> body.txt
          echo "" >> body.txt
          cat rapport.txt >> body.txt
          echo "---" >> body.txt
          echo "Approbation requise dans l'onglet Actions." >> body.txt
          ISSUE=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problemes")) | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --title "Problemes detectes dans le code" --body-file body.txt
          else
            gh issue comment "$ISSUE" --body-file body.txt
          fi

  rapport:
    needs: check
    if: needs.check.outputs.erreurs != '0'
    runs-on: ubuntu-latest
    environment: corrections
    steps:
      - uses: actions/checkout@v4
      - name: Rapport detaille
        run: |
          echo "### VERIFICATION DETAILLEE APPROUVEE" > detail.txt
          echo "Approuve le $(date -u '+%d/%m/%Y %H:%M UTC')" >> detail.txt
          echo "" >> detail.txt
          if find . -name "*.html" | grep -q .; then
            npx html-validate "**/*.html" >> detail.txt 2>&1 || true
          fi
          if find . -name "*.css" | grep -q .; then
            npx stylelint "**/*.css" >> detail.txt 2>&1 || true
          fi
          if find . -name "*.js" | grep -q .; then
            npx eslint "**/*.js" >> detail.txt 2>&1 || true
          fi
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh issue list --state open --json number,title --jq '.[] | select(.title | contains("Problemes")) | .number' | head -1)
          if [ -n "$ID" ]; then
            gh issue comment "$ID" --body-file detail.txt
          fi
