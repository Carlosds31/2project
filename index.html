<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7c3aed">
    <title>QUIZZANE — Connexion</title>

    <!-- Polices Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-card">
        <!-- Partie supérieure : fond violet avec vague -->
        <header class="auth-header">
            <h1 class="auth-title">Welcome</h1>
            <p class="auth-subtitle">Sign in to continue</p>

            <svg class="auth-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0,32 C320,90 1120,10 1440,50 L1440,120 L0,120 Z" fill="#ffffff"></path>
            </svg>
        </header>

        <!-- Formulaire et zone blanche -->
        <div class="auth-body">
            <form id="loginForm" class="auth-form" novalidate autocomplete="off">

                <!-- Champ Email or Phone -->
                <div class="field-wrapper">
                    <div class="input-container">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input
                            type="text"
                            id="emailInput"
                            class="auth-input"
                            placeholder="Email or Phone"
                            autocomplete="off"
                            spellcheck="false"
                            required
                        >
                    </div>

                    <!-- Touches d'accès rapide @ et .com -->
                    <div class="quick-keys" id="quickKeys">
                        <button type="button" class="quick-key-btn" data-insert="@">@</button>
                        <button type="button" class="quick-key-btn" data-insert=".com">.com</button>
                    </div>

                    <!-- Liste de suggestions de domaines d'email -->
                    <ul id="emailSuggestions" class="suggestions-list" role="listbox" hidden></ul>
                </div>

                <!-- Champ Password -->
                <div class="field-wrapper">
                    <div class="input-container">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="passwordInput"
                            class="auth-input"
                            placeholder="Password"
                            required
                        >
                        <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Afficher le mot de passe">
                            <svg id="eyeOpenIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eyeClosedIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-wrapper">
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn" class="auth-btn">Login</button>
            </form>

            <!-- Separator -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Buttons (Google + Apple, excluding Facebook) -->
            <div class="social-row">
                <button type="button" id="googleBtn" class="social-btn" aria-label="Connexion avec Google">
                    <svg viewBox="0 0 24 24" width="26" height="26">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 0 0 1 12c0 1.94.46 3.77 1.18 5.07l3.66-2.98z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>

                <button type="button" id="appleBtn" class="social-btn" aria-label="Connexion avec Apple">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="#000000">
                        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C3.79 16.17 4.36 9.02 8.7 8.76c1.26.06 2.14.7 2.88.74.99-.2 1.95-.77 3.02-.7 1.28.1 2.25.6 2.88 1.52-2.64 1.58-2.02 5.06.38 6.03-.45 1.18-1.03 2.35-1.81 3.93zM12.02 8.68c-.12-2.27 1.68-4.14 3.82-4.32.3 2.46-2.24 4.48-3.82 4.32z"/>
                    </svg>
                </button>
            </div>

            <!-- Sign Up Link -->
            <p class="signup-text">
                Don't have an account? <a href="#" class="signup-link">Sign up</a>
            </p>
        </div>
    </main>

    <!-- Modal Sélection Compte Google -->
    <div id="googleModal" class="modal-overlay" hidden aria-hidden="true">
        <div class="modal-card" role="dialog" aria-labelledby="googleModalTitle">
            <div class="modal-header">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 0 0 1 12c0 1.94.46 3.77 1.18 5.07l3.66-2.98z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <h2 id="googleModalTitle">Choisissez un compte</h2>
                <p>pour continuer vers QUIZZANE</p>
            </div>
            <div class="google-accounts-list">
                <button type="button" class="google-account-item" data-email="hassane@gmail.com" data-name="Hassane">
                    <div class="avatar">H</div>
                    <div class="account-info">
                        <div class="account-name">Hassane</div>
                        <div class="account-email">hassane@gmail.com</div>
                    </div>
                </button>
                <button type="button" class="google-account-item" data-email="user.demo@gmail.com" data-name="User Demo">
                    <div class="avatar" style="background:#059669;">U</div>
                    <div class="account-info">
                        <div class="account-name">User Demo</div>
                        <div class="account-email">user.demo@gmail.com</div>
                    </div>
                </button>
            </div>
            <button type="button" id="closeGoogleModal" class="modal-close-btn">Annuler</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
